[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS — Adaptive Trading Logic & Allocation System (monorepo root)"
requires-python = ">=3.12"
readme = "README.md"

# Root depends on every workspace member so `uv sync` installs them all.
dependencies = [
    "atlas-shared",
    "ingest-equities",
    "feature-engine",
    "quant-engine",
    "scoring-engine",
    "risk-engine",
    "explanation-engine",
    "backtest-service",
    "macro-engine",
    "sentiment-engine",
    "options-analytics",
    "news-ingest",
    "portfolio-service",
    "journal-service",
    "alert-service",
    "execution-service",
    "signal-service",
]

[tool.uv.workspace]
members = [
    "apps/ingest-equities",
    "apps/feature-engine",
    "apps/quant-engine",
    "apps/scoring-engine",
    "apps/risk-engine",
    "apps/explanation-engine",
    "apps/backtest-service",
    "apps/macro-engine",
    "apps/sentiment-engine",
    "apps/options-analytics",
    "apps/news-ingest",
    "apps/portfolio-service",
    "apps/journal-service",
    "apps/alert-service",
    "apps/execution-service",
    "apps/signal-service",
    "packages/shared-py",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
ingest-equities = { workspace = true }
feature-engine = { workspace = true }
quant-engine = { workspace = true }
scoring-engine = { workspace = true }
risk-engine = { workspace = true }
explanation-engine = { workspace = true }
backtest-service = { workspace = true }
macro-engine = { workspace = true }
sentiment-engine = { workspace = true }
options-analytics = { workspace = true }
news-ingest = { workspace = true }
portfolio-service = { workspace = true }
journal-service = { workspace = true }
alert-service = { workspace = true }
execution-service = { workspace = true }
signal-service = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipython>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# ML matrix-vs-vector convention (Xtr/Xte/Xy) violates N806; canonical and clear.
"apps/quant-engine/**/*.py" = ["N806"]
"apps/macro-engine/**/*.py" = ["N806"]
# FastAPI dependency injection idiom uses Query()/Depends() in defaults.
"apps/signal-service/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps", "packages"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
