[project]
name = "atlas-shared"
version = "0.1.0"
description = "Shared utilities: logging, DB clients, Pydantic schemas, env config."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "greenlet>=3.0",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_shared"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "atlas_shared/_migrations"
