[project]
name = "ingest-equities"
version = "0.1.0"
description = "OHLCV ingestion for US equities into TimescaleDB."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "feature-engine",
    "httpx>=0.27",
    "polars>=1.0",
    "pandas>=2.2",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "tenacity>=8.0",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
feature-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_equities"]
