[project]
name = "swing-engine"
version = "0.1.0"
description = "Rules-based daily swing-trading engine for US stocks (scan, rank, backtest)."
requires-python = ">=3.12"
dependencies = [
    "alert-service",
    "atlas-shared",
    "backtest-service",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "tenacity>=8.0",
]

[tool.uv.sources]
alert-service = { workspace = true }
atlas-shared = { workspace = true }
backtest-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_engine"]
