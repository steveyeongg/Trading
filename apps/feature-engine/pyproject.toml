[project]
name = "feature-engine"
version = "0.1.0"
description = "Technical indicator computation on OHLCV bars."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "polars>=1.0",
    "pandas>=2.2",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_engine"]
