[project]
name = "scoring-engine"
version = "0.1.0"
description = "Sub-scores → composite. Pure-Python; profiles will tell us if Numba is worth it."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "macro-engine",
    "sentiment-engine",
    "options-analytics",
    "numpy>=1.26",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
macro-engine = { workspace = true }
sentiment-engine = { workspace = true }
options-analytics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring_engine"]
