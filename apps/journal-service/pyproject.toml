[project]
name = "journal-service"
version = "0.1.0"
description = "Trade journal: auto-log closed trades, attribution stats."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "backtest-service",
    "feature-engine",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
backtest-service = { workspace = true }
feature-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_service"]
