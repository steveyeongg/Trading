[project]
name = "risk-engine"
version = "0.1.0"
description = "Position sizing, stops, portfolio guardrails."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "numpy>=1.26",
    "scipy>=1.13",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_engine"]
