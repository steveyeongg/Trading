[project]
name = "quant-engine"
version = "0.1.0"
description = "ML models for trend / volatility / regime. Phase 1: XGBoost trend only."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "joblib>=1.4",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_engine"]
