[project]
name = "explanation-engine"
version = "0.1.0"
description = "LLM-generated trade rationale. Claude API with prompt caching; templated fallback."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "anthropic>=0.39",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explanation_engine"]
