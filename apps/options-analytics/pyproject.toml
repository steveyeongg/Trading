[project]
name = "options-analytics"
version = "0.1.0"
description = "Options analytics: Black-Scholes Greeks, IV rank, put/call, GEX, max-pain → s_opt."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "numpy>=1.26",
    "scipy>=1.13",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_analytics"]
