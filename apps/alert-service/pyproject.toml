[project]
name = "alert-service"
version = "0.1.0"
description = "Alert rules + multi-channel delivery (log, webhook, telegram, email)."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_service"]
