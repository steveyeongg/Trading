[project]
name = "news-ingest"
version = "0.1.0"
description = "News ingestion: RSS, NewsAPI, file replay. Ticker extraction + scored persistence."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "sentiment-engine",
    "httpx>=0.27",
    "feedparser>=6.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "tenacity>=8.0",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
sentiment-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_ingest"]
