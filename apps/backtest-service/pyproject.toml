[project]
name = "backtest-service"
version = "0.1.0"
description = "Event-driven backtest engine with walk-forward, bootstrap, and cost sensitivity."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "feature-engine",
    "quant-engine",
    "scoring-engine",
    "risk-engine",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[tool.uv.sources]
atlas-shared = { workspace = true }
feature-engine = { workspace = true }
quant-engine = { workspace = true }
scoring-engine = { workspace = true }
risk-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_service"]
