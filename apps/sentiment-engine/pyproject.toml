[project]
name = "sentiment-engine"
version = "0.1.0"
description = "News + social sentiment scoring. Lexicon + optional FinBERT."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
finbert = [
    "transformers>=4.40",
    "torch>=2.0",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_engine"]
