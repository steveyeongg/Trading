[project]
name = "macro-engine"
version = "0.1.0"
description = "Macro data, regime classification, s_macro sub-score."
requires-python = ">=3.12"
dependencies = [
    "atlas-shared",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "tenacity>=8.0",
]

[tool.uv.sources]
atlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_engine"]
